{% load i18n %}
<div class="actions flex items-center gap-2">
    {% for field in action_form %}
        {% if field.label %}
            <label class="text-xs font-semibold text-gray-500 uppercase">
                {% if field.label == "Action:" %}Acción:{% else %}{{ field.label }}{% endif %}
            </label>
        {% endif %}
        {{ field }}
    {% endfor %}
    <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white font-medium text-xs px-3 py-2 rounded shadow-sm cursor-pointer" title="Ejecutar la acción seleccionada" name="index" value="{{ action_index|default:0 }}">
        Ejecutar
    </button>
</div>

<script>
    // Parche en vivo para forzar la traducción del option "Select action" que inyecta Alpine.js
    (function() {
        function traducirSelect() {
            var selects = document.querySelectorAll('.actions select');
            selects.forEach(function(select) {
                if (select.options.length > 0) {
                    for (var i = 0; i < select.options.length; i++) {
                        var opt = select.options[i];
                        if (opt.value === "" || opt.text.includes("Select action") || opt.text.includes("-----------")) {
                            opt.text = "Seleccionar acción...";
                        }
                    }
                }
            });
        }
        document.addEventListener("DOMContentLoaded", traducirSelect);
        setTimeout(traducirSelect, 200);
        setTimeout(traducirSelect, 800);
    })();
</script>
